name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend Checks (TypeCheck & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Type Check
        working-directory: backend
        run: npm run typecheck

      - name: Run Backend Tests
        working-directory: backend
        run: npm test

  extension-pipeline:
    name: Extension CI (Test, Build, Validate & Package)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'extension/package-lock.json'

      - name: Install Dependencies
        working-directory: extension
        run: npm ci

      - name: Type Check
        working-directory: extension
        run: npm run typecheck

      - name: Run Unit Tests
        working-directory: extension
        run: npm test

      - name: Build Production Extension
        working-directory: extension
        run: npm run build

      - name: Validate Manifest V3 Assets
        working-directory: extension
        run: npm run validate

      - name: Package Extension ZIP
        working-directory: extension
        run: npm run package

      - name: Upload Extension Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codemate-extension-build
          path: |
            extension/codemate-v*.zip
            extension/dist/
          if-no-files-found: error
          retention-days: 14
